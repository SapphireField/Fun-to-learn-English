<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LingoBuddy - English Learning</title>
    
    <!-- PWA / Mobile Settings -->
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="theme-color" content="#bae6fd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LingoBuddy" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/616/616408.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Added Comic Neue for English and Noto Sans SC for Chinese -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #e0f2fe; /* Light Sky */
        background-image: radial-gradient(#bae6fd 20%, transparent 20%), radial-gradient(#bae6fd 20%, transparent 20%);
        background-position: 0 0, 20px 20px;
        background-size: 40px 40px;
        overscroll-behavior-y: none;
      }
      /* Fun English Font */
      .english-font {
        font-family: 'Comic Neue', cursive;
      }
      /* Clean Chinese Font */
      .chinese-font {
        font-family: 'Noto Sans SC', sans-serif;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Bouncy Button Animation */
      .bouncy {
        transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .bouncy:active {
        transform: scale(0.9);
      }
      
      @media print {
        .no-print { display: none !important; }
        body { background-color: white; background-image: none; }
        .print-content { box-shadow: none !important; border: none !important; }
      }
    </style>

  }
}
